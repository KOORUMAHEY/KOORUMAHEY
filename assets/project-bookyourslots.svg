<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" width="300" height="340" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <clipPath id="art"><rect x="12" y="12" width="276" height="150" rx="10"/></clipPath>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="1" y="1" width="298" height="338" rx="14" fill="#0a1517" stroke="#123b33" stroke-width="1.5"/>
  <rect x="1" y="1" width="298" height="338" rx="14" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-dasharray="90 1182">
    <animate attributeName="stroke-dashoffset" from="-954" to="-2226" dur="7s" repeatCount="indefinite"/>
  </rect>
  <g clip-path="url(#art)">
    <rect x="12" y="12" width="276" height="150" fill="#071316"/>
    <!-- calendar -->
    <rect x="30" y="28" width="122" height="120" rx="10" fill="#0d2226" stroke="#1f5c4f"/>
    <path d="M30,52 V38 a10,10 0 0 1 10,-10 h102 a10,10 0 0 1 10,10 V52 Z" fill="#10B981"/>
    <text x="91" y="45" text-anchor="middle" fill="#022c22" font-size="11" font-weight="700" letter-spacing="2">BOOK A SLOT</text>
    <g fill="#12343a">
      <rect x="42" y="62" width="28" height="20" rx="4"/><rect x="78" y="62" width="28" height="20" rx="4"/><rect x="114" y="62" width="28" height="20" rx="4"/>
      <rect x="42" y="88" width="28" height="20" rx="4"/><rect x="114" y="88" width="28" height="20" rx="4"/>
      <rect x="42" y="114" width="28" height="20" rx="4"/><rect x="78" y="114" width="28" height="20" rx="4"/><rect x="114" y="114" width="28" height="20" rx="4"/>
    </g>
    <rect x="78" y="88" width="28" height="20" rx="4" fill="#12343a">
      <animate attributeName="fill" values="#12343a;#12343a;#10B981;#10B981;#12343a" keyTimes="0;.3;.4;.9;1" dur="5s" repeatCount="indefinite"/>
    </rect>
    <path d="M85,98 l5,5 l9,-10" fill="none" stroke="#ecfdf5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="22" stroke-dashoffset="22">
      <animate attributeName="stroke-dashoffset" values="22;22;0;0;22" keyTimes="0;.4;.5;.9;1" dur="5s" repeatCount="indefinite"/>
    </path>
    <!-- heart -->
    <g transform="translate(225,62)">
      <g>
        <animateTransform attributeName="transform" type="scale" values="1;1.25;1;1.15;1" keyTimes="0;.15;.3;.45;1" dur="1.2s" repeatCount="indefinite"/>
        <path transform="translate(-10,-8)" d="M0,4 C0,-2 8,-4 10,2 C12,-4 20,-2 20,4 C20,10 10,16 10,16 C10,16 0,10 0,4 Z" fill="#f43f5e" filter="url(#glow)"/>
      </g>
    </g>
    <!-- ecg -->
    <path d="M165,120 h25 l8,-18 l8,32 l8,-24 l6,10 h50" fill="none" stroke="#1f5c4f" stroke-width="2"/>
    <path d="M165,120 h25 l8,-18 l8,32 l8,-24 l6,10 h50" fill="none" stroke="#34d399" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="50 200" filter="url(#glow)">
      <animate attributeName="stroke-dashoffset" from="50" to="-200" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>
  <text x="20" y="196" fill="#34d399" font-size="19" font-weight="700">BookYourSlots</text>
  <path d="M266,182 h12 v12 M278,182 l-10,10" stroke="#64748b" stroke-width="1.8" fill="none"/>
  <text fill="#cbd5e1" font-size="13.5">
    <tspan x="20" y="224">Healthcare appointment booking</tspan>
    <tspan x="20" y="244">platform: find a doctor, pick a</tspan>
    <tspan x="20" y="264">slot, done.</tspan>
  </text>
  <g fill="#0d2226" stroke="#1f5c4f">
    <rect x="20" y="284" width="71" height="24" rx="12"/><rect x="99" y="284" width="78" height="24" rx="12"/><rect x="185" y="284" width="73" height="24" rx="12"/>
  </g>
  <g fill="#e2e8f0" font-size="12" text-anchor="middle">
    <text x="55.5" y="300">Next.js</text><text x="138" y="300">Firebase</text><text x="221.5" y="300">MongoDB</text>
  </g>
</svg>