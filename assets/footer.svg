<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#050b0d"/><stop offset="1" stop-color="#03171a"/></linearGradient>
    <radialGradient id="neb" cx=".75" cy=".4" r=".5"><stop offset="0" stop-color="#10B981" stop-opacity=".3"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <radialGradient id="planet" cx=".6" cy=".1" r=".9"><stop offset="0" stop-color="#5eead4"/><stop offset=".15" stop-color="#14b8a6"/><stop offset=".45" stop-color="#0f3d3a"/><stop offset="1" stop-color="#020c0c"/></radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ee7b7"><animate attributeName="stop-color" values="#6ee7b7;#22d3ee;#6ee7b7" dur="6s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="1200" height="260" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="260" rx="16" fill="url(#neb)"/>
  <g fill="#ffffff">
    <animate attributeName="opacity" values=".3;1;.3" dur="3s" repeatCount="indefinite"/>
    <circle cx="80" cy="40" r="1.2"/><circle cx="420" cy="30" r="1"/><circle cx="620" cy="70" r="1.3"/><circle cx="900" cy="25" r="1"/><circle cx="1150" cy="60" r="1.2"/><circle cx="760" cy="200" r="1"/>
  </g>
  <g fill="#a7f3d0">
    <animate attributeName="opacity" values="1;.2;1" dur="4.2s" repeatCount="indefinite"/>
    <circle cx="300" cy="60" r="1"/><circle cx="520" cy="200" r="1.1"/><circle cx="1040" cy="210" r="1"/><circle cx="200" cy="25" r="1.3"/>
  </g>

  <circle cx="280" cy="560" r="380" fill="#10B981" opacity=".2" filter="url(#blur)"/>
  <circle cx="280" cy="560" r="360" fill="url(#planet)"/>
  <circle cx="280" cy="560" r="360" fill="none" stroke="#5eead4" stroke-opacity=".5" stroke-width="2" filter="url(#glow)"/>

  <!-- cliff + astronaut -->
  <path d="M300,260 L360,212 L410,200 L455,208 L520,260 Z" fill="#020807"/>
  <g fill="#020807" stroke="#34d399" stroke-opacity=".6" stroke-width=".8">
    <rect x="424" y="174" width="7" height="14" rx="2"/>
    <rect x="429" y="170" width="14" height="20" rx="4"/>
    <circle cx="436" cy="162" r="8"/>
    <rect x="430" y="188" width="5" height="14" rx="2"/><rect x="437" y="188" width="5" height="14" rx="2"/>
  </g>
  <circle cx="433" cy="150" r="1.6" fill="#34d399"><animate attributeName="opacity" values="1;0;1" dur="1.4s" repeatCount="indefinite"/></circle>
  <path d="M433,152 V156" stroke="#34d399" stroke-opacity=".6"/>

  <text x="760" y="110" text-anchor="middle" fill="#a7f3d0" font-size="26" font-family="'Segoe Script','Brush Script MT','Lucida Handwriting',cursive">Small steps. Build big worlds.</text>
  <text x="760" y="160" text-anchor="middle" fill="#475569" font-size="12" letter-spacing="5">BUILD  &lt;  LEARN  &lt;  EXPLORE  &lt;  IMPACT</text>

  <text x="1160" y="200" text-anchor="end" fill="url(#brand)" font-size="30" font-weight="700" letter-spacing="10" filter="url(#glow)">CODEVERSE</text>
  <text x="1130" y="228" text-anchor="end" fill="#cbd5e1" font-size="13">The Universe Built by Kooru Mahey</text>
  <path d="M1140,224 h14 m-5,-5 l5,5 l-5,5" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round">
    <animateTransform attributeName="transform" type="translate" values="0,0;6,0;0,0" dur="1.4s" repeatCount="indefinite"/>
  </path>
</svg>