<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif">
  <!-- About card -->
  <rect x="10" y="10" width="575" height="280" rx="16" fill="#0a1517" stroke="#123b33" stroke-width="1.5"/>
  <rect x="10" y="10" width="575" height="280" rx="16" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-dasharray="140 1570">
    <animate attributeName="stroke-dashoffset" from="0" to="-1710" dur="9s" repeatCount="indefinite"/>
  </rect>
  <g transform="translate(40,38)" fill="none" stroke="#34d399" stroke-width="2">
    <circle cx="10" cy="7" r="6"/><path d="M0,24 C0,14 20,14 20,24"/>
  </g>
  <text x="72" y="56" fill="#f1f5f9" font-size="20" font-weight="600">About Me</text>
  <text fill="#cbd5e1" font-size="15">
    <tspan x="40" y="98">I'm <tspan fill="#34d399" font-weight="600">Kooru Mahey</tspan>, a passionate developer from</tspan>
    <tspan x="40" y="122">Tiruchirappalli, Tamil Nadu, India. I love building intelligent</tspan>
    <tspan x="40" y="146">systems, exploring AI/ML, robotics and creating real-world</tspan>
    <tspan x="40" y="170">solutions through code.</tspan>
  </text>
  <g fill="none" stroke="#34d399" stroke-width="1.8">
    <g transform="translate(40,194)"><path d="M7,0 C3,0 0,3 0,7 C0,12 7,18 7,18 C7,18 14,12 14,7 C14,3 11,0 7,0 Z"/><circle cx="7" cy="7" r="2.5"/></g>
    <path transform="translate(37,226)" d="M0,6 L10,1 L20,6 L10,11 Z M4,8 V13 C4,16 16,16 16,13 V8"/>
  </g>
  <text x="38" y="268" fill="#34d399" font-size="14" font-weight="700">&lt;/&gt;</text>
  <text x="70" y="208" fill="#cbd5e1" font-size="14">Tiruchirappalli, Tamil Nadu, India</text>
  <text x="70" y="238" fill="#cbd5e1" font-size="14">M.Sc. Integrated Computer Science · Pondicherry University · 2026</text>
  <text x="70" y="267" fill="#cbd5e1" font-size="14">AI  |  ML  |  Robotics  |  Full Stack  |  Research  |  Innovation</text>

  <!-- Focus card -->
  <rect x="605" y="10" width="585" height="280" rx="16" fill="#0a1517" stroke="#123b33" stroke-width="1.5"/>
  <rect x="605" y="10" width="585" height="280" rx="16" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-dasharray="140 1590">
    <animate attributeName="stroke-dashoffset" from="-865" to="-2595" dur="9s" repeatCount="indefinite"/>
  </rect>
  <g transform="translate(645,48)" fill="none" stroke="#34d399" stroke-width="2">
    <circle r="10"/><circle r="5"/><circle r="1.5" fill="#34d399"/>
    <circle r="10" stroke-width="1.5">
      <animate attributeName="r" values="10;20" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".8;0" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  <text x="670" y="56" fill="#f1f5f9" font-size="20" font-weight="600">Current Focus</text>

  <g fill="none" stroke="#34d399" stroke-width="1.8">
    <!-- chip -->
    <g transform="translate(636,90)">
      <rect x="3" y="3" width="16" height="16" rx="3"/><rect x="8" y="8" width="6" height="6" fill="#34d399"/>
      <path d="M7,0 v3 M15,0 v3 M7,19 v3 M15,19 v3 M0,7 h3 M0,15 h3 M19,7 h3 M19,15 h3"/>
    </g>
    <!-- robot -->
    <g transform="translate(636,134)">
      <rect x="1" y="6" width="20" height="15" rx="4"/><path d="M11,6 V1"/><circle cx="11" cy="1" r="1.5" fill="#34d399"/>
      <circle cx="7" cy="13" r="2" fill="#34d399"><animate attributeName="r" values="2;2;.3;2" keyTimes="0;.9;.95;1" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="15" cy="13" r="2" fill="#34d399"><animate attributeName="r" values="2;2;.3;2" keyTimes="0;.9;.95;1" dur="3s" repeatCount="indefinite"/></circle>
    </g>
    <!-- bulb -->
    <g transform="translate(638,222)">
      <path d="M9,0 C3,0 0,4 0,9 C0,13 4,15 4,19 H14 C14,15 18,13 18,9 C18,4 15,0 9,0 Z"><animate attributeName="fill" values="none;#34d399;none" dur="3s" repeatCount="indefinite"/></path>
      <path d="M5,23 H13"/>
    </g>
  </g>
  <text x="636" y="198" fill="#34d399" font-size="15" font-weight="700">&lt;/&gt;</text>
  <g fill="#e2e8f0" font-size="15.5">
    <text x="676" y="106">AI &amp; Machine Learning</text>
    <text x="676" y="150">Robotics &amp; Reinforcement Learning</text>
    <text x="676" y="194">Software Engineering &amp; Full Stack</text>
    <text x="676" y="238">Research &amp; Innovation</text>
  </g>
  <line x1="960" y1="80" x2="960" y2="260" stroke="#123b33" stroke-width="1.5"/>
  <g fill="#a7f3d0" font-size="24" font-style="italic">
    <text x="988" y="118">“Better<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.9;1" dur="8s" repeatCount="indefinite"/></text>
    <text x="988" y="150">systems.<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.1;.18;.9;1" dur="8s" repeatCount="indefinite"/></text>
    <text x="988" y="182">A smarter<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.2;.28;.9;1" dur="8s" repeatCount="indefinite"/></text>
    <text x="988" y="214">tomorrow.”<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.3;.38;.9;1" dur="8s" repeatCount="indefinite"/></text>
  </g>
  <line x1="990" y1="236" x2="1040" y2="236" stroke="#10B981" stroke-width="2"/>
</svg>